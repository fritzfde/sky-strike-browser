<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Sky Strike</title><style>
body{margin:0;overflow:hidden;background:#000;font-family:monospace;color:#0f0;user-select:none;touch-action:none}
#hud{position:fixed;inset:0;pointer-events:none}
.p{position:absolute;text-shadow:0 0 4px #000;font-size:15px}
#cross{left:50%;top:50%;transform:translate(-50%,-50%);font-size:28px}
#lock{position:absolute;width:40px;height:40px;border:2px solid #ff0;display:none;transform:translate(-50%,-50%)}
#radar{position:absolute;right:10px;top:10px;width:150px;height:150px;border-radius:50%;background:rgba(0,40,0,.5);border:2px solid #0f0}
#msg{left:50%;top:35%;transform:translateX(-50%);font-size:32px;color:#f44;text-align:center}
#hpbar{left:10px;bottom:10px;width:200px;height:14px;border:1px solid #0f0}#hp{height:100%;background:#0f0}
#start{position:fixed;inset:0;background:rgba(0,0,0,.8);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:16px;z-index:5;text-align:center}
#start h1{font-size:48px;color:#0ff}
.tb{position:fixed;bottom:20px;width:70px;height:70px;border-radius:50%;background:rgba(255,255,255,.2);border:2px solid #fff;color:#fff;display:none;align-items:center;justify-content:center;z-index:4}
#stick{position:fixed;left:20px;bottom:20px;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.15);display:none;z-index:4}
</style></head><body>
<div id="hud"><div class="p" id="cross">+</div><div id="lock"></div><canvas id="radar" width="150" height="150"></canvas>
<div class="p" id="info" style="left:10px;top:10px"></div><div class="p" id="msg"></div><div class="p" id="hpbar"><div id="hp"></div></div></div>
<div id="start"><h1>SKY STRIKE</h1><p>W/S throttle · Mouse or Arrows: pitch/roll · A/D yaw<br>Left click / Space: guns · Right click / F: missile (hold aim on target to lock)<br>Touch: left stick, buttons on right</p><p style="color:#ff0">Click / tap to start</p></div>
<div id="stick"></div><div class="tb" id="bGun" style="right:20px">GUN</div><div class="tb" id="bMsl" style="right:100px">MSL</div><div class="tb" id="bThr" style="right:20px;bottom:100px">THR+</div><div class="tb" id="bBrk" style="right:100px;bottom:100px">THR-</div>
<script type="module" src="game.js"></script></body></html>
